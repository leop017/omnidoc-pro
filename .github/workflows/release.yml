name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # sdist + wheel — 平台无关，在 Linux 上构建
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build --outdir dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # PyInstaller exe — 只能在 Windows 上构建（.exe 平台相关）
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install pyinstaller
          # 必须装全量可选依赖，与 0.1.0 本地构建环境对齐（spec 里 collect_all 依赖 gradio/markitdown/magika 等的完整依赖树）
          # markitdown[all] 带全引擎（PDF/PPT/图片/音频/URL），collect_all('markitdown') 才能收全
          pip install -e ".[markitdown-all,gui,llm,cli,test,legacy-doc]"

      - name: Build CLI exe
        run: |
          # PyInstaller --distpath 默认输出到 ./dist，spec 已用 name=omnidoc
          python -m PyInstaller omnidoc.spec --clean --noconfirm
          if (-not (Test-Path "dist\omnidoc.exe")) { Write-Error "omnidoc.exe not found in dist" }

      - name: Build WebUI exe
        run: |
          python -m PyInstaller omnidoc-web.spec --clean --noconfirm
          if (-not (Test-Path "dist\omnidoc-web.exe")) { Write-Error "omnidoc-web.exe not found in dist" }

      - name: List exe artifacts
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object { "$($_.Name)  ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Upload exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: |
            dist/omnidoc.exe
            dist/omnidoc-web.exe

  release:
    needs: [build, build-exe]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download sdist/wheel
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Download exes
        uses: actions/download-artifact@v4
        with:
          name: exe
          path: dist

      - name: Check release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          core="${version%%-*}"
          notes_file="RELEASE_NOTES/${core}.md"
          if [[ -f "$notes_file" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "version=${core}" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "version=${core}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: false
          body: |
            ## 版本 ${{ steps.notes.outputs.version }}
            详细更新日志请见 `RELEASE_NOTES/${{ steps.notes.outputs.version }}.md`。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install twine
        run: pip install --upgrade twine

      - name: Upload to PyPI
        shell: bash
        run: |
          set -uo pipefail
          API_TOKEN="${{ secrets.PYPI_API_TOKEN }}"
          LEGACY_USER="${{ secrets.PYPI_USERNAME }}"
          LEGACY_PASS="${{ secrets.PYPI_TOKEN }}"
          if [ -n "$LEGACY_USER" ] && [ -n "$LEGACY_PASS" ]; then
            echo "::notice::Using PYPI_USERNAME + PYPI_TOKEN (legacy auth)."
            twine upload --repository-url https://upload.pypi.org/legacy/ \
              -u "$LEGACY_USER" \
              -p "$LEGACY_PASS" \
              dist/*.whl dist/*.tar.gz
          elif [ -n "$API_TOKEN" ]; then
            echo "::notice::Using PYPI_API_TOKEN (Trusted Publishing)."
            twine upload --repository-url https://upload.pypi.org/legacy/ \
              --username __token__ \
              --password "$API_TOKEN" \
              dist/*.whl dist/*.tar.gz
          else
            echo "::error::No PyPI credentials found. Set PYPI_USERNAME + PYPI_TOKEN (legacy) or PYPI_API_TOKEN (Trusted Publishing) in repo secrets."
            exit 1
          fi

      - name: Verify PyPI upload
        shell: bash
        run: |
          version=$(grep -E '^version\s*=' pyproject.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "::notice::Verifying omnidoc-pro ${version} on PyPI..."
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/omnidoc-pro/${version}/json")
          echo "::notice::PyPI HTTP status for ${version}: ${status}"
          if [ "$status" = "200" ]; then
            echo "::notice::omnidoc-pro ${version} confirmed on PyPI."
          else
            echo "::warning::omnidoc-pro ${version} not confirmed yet; re-check https://pypi.org/project/omnidoc-pro/ in a few minutes."
          fi
          exit 0
