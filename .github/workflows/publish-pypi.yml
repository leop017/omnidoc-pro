name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build --outdir dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install twine
        run: pip install --upgrade twine

      - name: Check if version already published
        id: skip
        shell: bash
        run: |
          version=$(grep -E '^version\s*=' pyproject.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::Could not extract version from pyproject.toml; refusing to skip so we always attempt upload."
            exit 0
          fi
          echo "::notice::Extracted version: ${version}"
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/omnidoc-pro/${version}/json" || echo "000")
          echo "::notice::PyPI HTTP status for ${version}: ${code}"
          if [ "$code" = "200" ]; then
            echo "::notice::omnidoc-pro ${version} already on PyPI, skipping upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::omnidoc-pro ${version} not confirmed on PyPI (HTTP ${code}), will upload."
          fi

      - name: Upload to PyPI
        if: ${{ steps.skip.outputs.skip != 'true' }}
        run: |
          twine upload --repository-url https://upload.pypi.org/legacy/ \
            -u "${{ secrets.PYPI_USERNAME }}" \
            -p "${{ secrets.PYPI_TOKEN }}" \
            dist/*

      - name: Verify upload succeeded
        if: ${{ steps.skip.outputs.skip != 'true' }}
        shell: bash
        run: |
          version=$(grep -E '^version\s*=' pyproject.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "::notice::Verifying omnidoc-pro ${version} on PyPI..."
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/omnidoc-pro/${version}/json" || echo "000")
          echo "::notice::PyPI HTTP status for ${version}: ${code}"
          if [ "$code" != "200" ]; then
            echo "::warning::omnidoc-pro ${version} may still be propagating (PyPI has a short delay). Re-check https://pypi.org/project/omnidoc-pro/ in a few minutes."
          else
            echo "::notice::omnidoc-pro ${version} confirmed on PyPI."
          fi
