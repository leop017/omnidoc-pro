name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (e.g. v0.1.1)"
        required: true
        default: "v0.1.1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build --outdir dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install twine
        run: pip install --upgrade twine

      - name: Upload to PyPI
        shell: bash
        run: |
          set -uo pipefail
          API_TOKEN="${{ secrets.PYPI_API_TOKEN }}"
          LEGACY_USER="${{ secrets.PYPI_USERNAME }}"
          LEGACY_PASS="${{ secrets.PYPI_TOKEN }}"
          if [ -n "$LEGACY_USER" ] && [ -n "$LEGACY_PASS" ]; then
            echo "::notice::Using PYPI_USERNAME + PYPI_TOKEN (legacy auth)."
            twine upload --repository-url https://upload.pypi.org/legacy/ \
              -u "$LEGACY_USER" \
              -p "$LEGACY_PASS" \
              dist/*.whl dist/*.tar.gz
          elif [ -n "$API_TOKEN" ]; then
            echo "::notice::Using PYPI_API_TOKEN (Trusted Publishing)."
            twine upload --repository-url https://upload.pypi.org/legacy/ \
              --username __token__ \
              --password "$API_TOKEN" \
              dist/*.whl dist/*.tar.gz
          else
            echo "::error::No PyPI credentials found. Set PYPI_USERNAME + PYPI_TOKEN or PYPI_API_TOKEN in repo secrets."
            exit 1
          fi
