name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build --outdir dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install twine
        run: pip install --upgrade twine

      - name: Check if version already published
        id: skip
        shell: bash
        run: |
          version=$(grep -E '^version\s*=' pyproject.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::Could not extract version from pyproject.toml; refusing to skip so we always attempt upload."
            exit 0
          fi
          echo "::notice::Extracted version: ${version}"
          status=$(OMNIDOC_VERSION="${version}" python - <<'PY'
import os, urllib.request, urllib.error
try:
    req = urllib.request.Request(
        "https://pypi.org/pypi/omnidoc-pro/%s/json" % os.environ["OMNIDOC_VERSION"],
        headers={"User-Agent": "omnidoc-pro-ci"},
    )
    urllib.request.urlopen(req, timeout=30)
    print("200")
except urllib.error.HTTPError as e:
    print(str(e.code))
except Exception:
    print("ERR")
PY
          )
          echo "::notice::PyPI HTTP status for ${version}: ${status}"
          if [ "$status" = "200" ]; then
            echo "::notice::omnidoc-pro ${version} already on PyPI, skipping upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::omnidoc-pro ${version} not confirmed on PyPI (status ${status}), will upload."
          fi
          exit 0

      - name: Upload to PyPI
        if: ${{ steps.skip.outputs.skip != 'true' }}
        run: |
          twine upload --repository-url https://upload.pypi.org/legacy/ \
            -u "${{ secrets.PYPI_USERNAME }}" \
            -p "${{ secrets.PYPI_TOKEN }}" \
            dist/*

      - name: Verify upload succeeded
        if: ${{ steps.skip.outputs.skip != 'true' }}
        shell: bash
        run: |
          version=$(grep -E '^version\s*=' pyproject.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "::notice::Verifying omnidoc-pro ${version} on PyPI..."
          status=$(OMNIDOC_VERSION="${version}" python - <<'PY'
import os, urllib.request, urllib.error
try:
    req = urllib.request.Request(
        "https://pypi.org/pypi/omnidoc-pro/%s/json" % os.environ["OMNIDOC_VERSION"],
        headers={"User-Agent": "omnidoc-pro-ci"},
    )
    urllib.request.urlopen(req, timeout=30)
    print("200")
except urllib.error.HTTPError as e:
    print(str(e.code))
except Exception:
    print("ERR")
PY
          )
          echo "::notice::PyPI HTTP status for ${version}: ${status}"
          if [ "$status" = "200" ]; then
            echo "::notice::omnidoc-pro ${version} confirmed on PyPI."
          else
            echo "::warning::omnidoc-pro ${version} not confirmed on PyPI yet (status ${status}); PyPI has a short propagation delay — re-check https://pypi.org/project/omnidoc-pro/ in a few minutes."
          fi
          exit 0
