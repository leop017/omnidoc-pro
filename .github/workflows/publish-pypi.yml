name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build --outdir dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install twine
        run: pip install --upgrade twine

      - name: Skip if version already published
        id: skip
        shell: bash
        run: |
          # Version is authoritative in pyproject.toml (kept in sync with dist filenames)
          version=$(grep -E '^version\s*=' pyproject.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "::notice::Checking PyPI for existing ${version}..."
          if curl -fsSL "https://pypi.org/pypi/omnidoc-pro/${version}/json" >/dev/null 2>&1; then
            echo "::notice::omnidoc-pro ${version} already on PyPI, skipping upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to PyPI
        if: ${{ steps.skip.outputs.skip != 'true' }}
        run: |
          twine upload --repository-url https://upload.pypi.org/legacy/ \
            -u "${{ secrets.PYPI_USERNAME }}" \
            -p "${{ secrets.PYPI_TOKEN }}" \
            dist/*
