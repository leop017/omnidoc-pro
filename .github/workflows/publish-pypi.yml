name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (e.g. v0.1.1)"
        required: true
        default: "v0.1.1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build --outdir dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install twine
        run: pip install --upgrade twine

      - name: Diagnostics
        shell: bash
        run: |
          echo "---- twine upload diagnostics ----"
          echo "files: $(ls dist/ | tr '\n' ' ')"
          echo "twine: $(twine --version)"
          # Each ${{ secrets.X }} below is text-substituted by Actions into the script source:
          # an undefined/empty secret becomes a literal empty string -> tests "no".
          echo "PYPI_USERNAME set:    $([ -n "${{ secrets.PYPI_USERNAME }}" ] && echo yes || echo no)"
          echo "PYPI_TOKEN set:       $([ -n "${{ secrets.PYPI_TOKEN }}" ] && echo yes || echo no)"
          echo "PYPI_API_TOKEN set:   $([ -n "${{ secrets.PYPI_API_TOKEN }}" ] && echo yes || echo no)"

      - name: Upload to PyPI (legacy auth preferred, Trusted Publishing fallback)
        shell: bash
        run: |
          set -uo pipefail
          API_TOKEN="${{ secrets.PYPI_API_TOKEN }}"
          LEGACY_USER="${{ secrets.PYPI_USERNAME }}"
          LEGACY_PASS="${{ secrets.PYPI_TOKEN }}"
          if [ -n "$LEGACY_USER" ] && [ -n "$LEGACY_PASS" ]; then
            echo "Using legacy PYPI_USERNAME + PYPI_TOKEN credentials."
            twine upload --repository-url https://upload.pypi.org/legacy/ \
              -u "$LEGACY_USER" \
              -p "$LEGACY_PASS" \
              dist/* 2>&1 | tee /tmp/twine_upload.log
            exit_code=${PIPESTATUS[0]}
            if [ "$exit_code" -ne 0 ]; then
              echo "ERROR: twine upload failed (exit ${exit_code}). Output:"
              cat /tmp/twine_upload.log
              exit "$exit_code"
            fi
            echo "Upload completed successfully."
          elif [ -n "$API_TOKEN" ]; then
            echo "Using Trusted Publishing (PYPI_API_TOKEN + __token__)."
            twine upload --repository-url https://upload.pypi.org/legacy/ \
              --username __token__ \
              --password "$API_TOKEN" \
              dist/* 2>&1 | tee /tmp/twine_upload.log
            exit_code=${PIPESTATUS[0]}
            if [ "$exit_code" -ne 0 ]; then
              echo "ERROR: twine upload failed (exit ${exit_code}). Output:"
              cat /tmp/twine_upload.log
              exit "$exit_code"
            fi
            echo "Upload completed successfully."
          else
            echo "ERROR: No PyPI credentials configured."
            echo "Set PYPI_USERNAME + PYPI_TOKEN (legacy) OR PYPI_API_TOKEN (Trusted Publishing) in repo secrets."
            exit 1
          fi

      - name: Verify upload succeeded
        shell: bash
        run: |
          whl=$(ls dist/*.whl 2>/dev/null | head -n 1)
          if [[ -z "$whl" ]]; then
            echo "::warning::No wheel found in dist/, cannot verify upload."
            exit 0
          fi
          version=$(basename "$whl" | sed -E 's/^omnidoc_pro-//; s/-py3.*$//')
          echo "::notice::Verifying omnidoc-pro ${version} on PyPI..."
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/omnidoc-pro/${version}/json")
          echo "::notice::PyPI HTTP status for ${version}: ${status}"
          if [ "$status" = "200" ]; then
            echo "::notice::omnidoc-pro ${version} confirmed on PyPI."
          else
            echo "::warning::omnidoc-pro ${version} not confirmed on PyPI yet (status ${status}); PyPI has a short propagation delay — re-check https://pypi.org/project/omnidoc-pro/ in a few minutes."
          fi
          exit 0
