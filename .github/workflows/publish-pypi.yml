name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (e.g. v0.1.1)"
        required: true
        default: "v0.1.1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build --outdir dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install twine
        run: pip install --upgrade twine

      - name: Upload to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          PYPI_USERNAME: ${{ secrets.PYPI_USERNAME }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          echo "PYPI_API_TOKEN set: $([ -n "$PYPI_API_TOKEN" ] && echo yes || echo no)"
          echo "PYPI_API_TOKEN length: ${#PYPI_API_TOKEN}"
          echo "PYPI_API_TOKEN prefix: ${PYPI_API_TOKEN:0:8}..."
          echo "PYPI_USERNAME set: $([ -n "$PYPI_USERNAME" ] && echo yes || echo no)"
          echo "PYPI_TOKEN set: $([ -n "$PYPI_TOKEN" ] && echo yes || echo no)"
          if [ -n "$PYPI_API_TOKEN" ]; then
            twine upload --username __token__ --password "$PYPI_API_TOKEN" dist/*
          elif [ -n "$PYPI_USERNAME" ] && [ -n "$PYPI_TOKEN" ]; then
            twine upload --username "$PYPI_USERNAME" --password "$PYPI_TOKEN" dist/*
          else
            echo "::error::No PyPI credentials found"
            exit 1
          fi
