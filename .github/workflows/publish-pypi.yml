name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (e.g. v0.1.1)"
        required: true
        default: "v0.1.3"

permissions:
  contents: read

jobs:
  # 发布门禁：ruff + pytest 全量测试，不通过则阻断 PyPI 构建与上传
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -e ".[full,test]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: python -m pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build --outdir dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check if package is already on PyPI
        id: check
        run: |
          VERSION=${{ inputs.ref }}
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.ref_name }}"
          fi
          VERSION="${VERSION#v}"
          echo "Checking version: ${VERSION}"
          if curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/omnidoc-pro/${VERSION}/json" | grep -q "404"; then
            echo "Version ${VERSION} not yet on PyPI, proceeding with upload."
            echo "should_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${VERSION} already exists on PyPI, skipping upload."
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install twine
        if: steps.check.outputs.should_upload == 'true'
        run: pip install --upgrade twine

      - name: Upload to PyPI
        if: steps.check.outputs.should_upload == 'true'
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload --username __token__ --password "$PYPI_API_TOKEN" dist/*

      - name: Confirm already-published
        if: steps.check.outputs.should_upload == 'false'
        run: |
          echo "No-op: this version was already published to PyPI in a previous run."
          echo "✅ Release is up-to-date on PyPI."
